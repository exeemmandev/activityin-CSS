<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
</head>

<body style="
    margin: 0;
    background-color: white;
">

    <!-- BLUE BOX -->
    <div style="
        position: absolute;
        top: 20px;
        left: 200px;
        width: 500px;
        height: 300px;
        background-color: blue;
    ">

        <!-- RED CIRCLE -->
        <div style="
            position: absolute;
            top: 150px;
            left: 250px;
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
        ">
        </div>

    </div>

</body>
</html>
