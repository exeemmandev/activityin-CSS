<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
</head>

<body style="
    margin: 0;
    padding: 16px;
    background-color: white;
">

    <h1 style="
        margin: 35px 0 70px 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 76px;
        font-weight: bold;
        color: black;
    ">
        CSS Display Property
    </h1>


    <!-- RED BOX -->
    <div style="
        display: block;
        width: 544px;
        height: 544px;
        background-color: red;
        margin-bottom: 43px;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 40px;
            font-weight: bold;
        ">
            Red Paragraph
        </p>
    </div>


    <!-- GREEN BOX -->
    <div style="
        display: block;
        width: 544px;
        height: 544px;
        background-color: green;
        margin-bottom: 43px;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 40px;
            font-weight: bold;
        ">
            Green Paragraph
        </p>
    </div>


    <!-- BLUE BOX -->
    <div style="
        display: block;
        width: 544px;
        height: 544px;
        background-color: blue;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 40px;
            font-weight: bold;
        ">
            Blue Paragraph
        </p>
    </div>

</body>

</html>
