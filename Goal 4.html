<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important CSS Properties</title>
</head>

<body style="
    margin: 0;
    padding: 45px 10px;
    background-color: #6594e8;
    color: white;
    font-family: Georgia, 'Times New Roman', serif;
">

    <h1 style="
        margin: 0;
        font-size: 78px;
        font-weight: bold;
        line-height: 1.1;
    ">
        Important CSS Properties
    </h1>

    <p style="
        margin: 65px 0 0 0;
        font-size: 40px;
        color: #ff7f45;
    ">
        Color
    </p>

    <p style="
        margin: 155px 0 0 0;
        font-size: 128px;
        font-weight: normal;
        line-height: 1;
    ">
        Font Size
    </p>

    <p style="
        margin: 160px 0 0 0;
        font-size: 40px;
        font-weight: bold;
    ">
        Font Weight
    </p>

    <p style="
        margin: 48px 0 0 0;
        font-size: 40px;
        font-family: 'Brush Script MT', 'Segoe Script', cursive;
        font-style: italic;
    ">
        Font Family
    </p>

    <p style="
        margin: 48px 0 0 0;
        font-size: 40px;
        text-align: right;
        padding-right: 5px;
    ">
        Text Align
    </p>

</body>
</html>
