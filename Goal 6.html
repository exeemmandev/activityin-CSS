<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding</title>
</head>

<body style="
    margin: 0;
    padding: 30px;
    background-color: white;
">

    <!-- PURPLE OUTER BOX -->
    <div style="
        width: 100%;
        height: 670px;
        background-color: purple;
        padding: 40px;
        box-sizing: border-box;
    ">

        <!-- BLUE INNER BOX -->
        <div style="
            width: 100%;
            height: 590px;
            background-color: blue;
            padding: 10px;
            box-sizing: border-box;
        ">

            <!-- YELLOW TEXT -->
            <div style="
                margin: 40px 28px 5px 28px;
                color: yellow;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 44px;
                line-height: 1;
            ">
                Yellow Text
            </div>

            <!-- FIRST RED BOX -->
            <div style="
                width: calc(100% - 38px);
                height: 148px;
                margin-left: 28px;
                background-color: red;
                padding: 35px;
                box-sizing: border-box;
            ">
                <span style="
                    color: white;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 44px;
                ">
                    White Text
                </span>
            </div>

            <!-- SECOND YELLOW TEXT -->
            <div style="
                margin: 82px 28px 8px 28px;
                color: yellow;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 44px;
                line-height: 1;
            ">
                Yellow Text
            </div>

            <!-- SECOND RED BOX -->
            <div style="
                width: calc(100% - 38px);
                height: 150px;
                margin-left: 28px;
                background-color: red;
                padding: 35px;
                box-sizing: border-box;
            ">
                <span style="
                    color: white;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 44px;
                ">
                    White Text
                </span>
            </div>

        </div>

    </div>

</body>
</html>
