<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
</head>

<body style="
    margin: 0;
    padding: 15px;
    background-color: white;
">

    <h1 style="
        margin: 35px 0 90px 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 58px;
        font-weight: bold;
        color: black;
    ">
        CSS Display Property
    </h1>

    <!-- RED PARAGRAPH -->
    <div style="
        display: inline-block;
        vertical-align: top;
        width: 32%;
        height: 460px;
        margin-right: 5px;
        background-color: red;
        box-sizing: border-box;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 32px;
            font-weight: bold;
        ">
            Red Paragraph
        </p>
    </div>

    <!-- GREEN PARAGRAPH -->
    <div style="
        display: inline-block;
        vertical-align: top;
        width: 32%;
        height: 460px;
        margin-right: 5px;
        background-color: green;
        box-sizing: border-box;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 32px;
            font-weight: bold;
        ">
            Green Paragraph
        </p>
    </div>

    <!-- BLUE PARAGRAPH -->
    <div style="
        display: inline-block;
        vertical-align: top;
        width: 32%;
        height: 460px;
        background-color: blue;
        box-sizing: border-box;
    ">
        <p style="
            margin: 0;
            color: white;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 32px;
            font-weight: bold;
        ">
            Blue Paragraph
        </p>
    </div>

</body>
</html>
